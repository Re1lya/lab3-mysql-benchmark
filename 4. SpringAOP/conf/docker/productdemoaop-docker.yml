# Canonical lab 3 deployment. Use deploy/lab3/deploy.sh on CDWY1.
version: "3.9"
services:
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/oomall-javaee/mysql@sha256:2628694417009017902fb7c7036c6c45eef9d59587ddaa50dd2414d9ac59533c
    networks: [javaee-proxy]
    ports:
      - {target: 3306, published: 3306, protocol: tcp}
    volumes:
      - /root/mysql/sql:/sql:ro
      - /root/mysql/conf.d:/etc/mysql/conf.d:ro
      - /root/mysql/log:/var/log/mysql
      - /root/mysql/data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Load private deployment environment}
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.mysql == yes]
  productdemoaop:
    image: ${APP_IMAGE:-xmu-javaee/productdemoaop:lab3-teacher-20261018}
    networks: [javaee-proxy]
    ports:
      - {target: 8080, published: "${APP_PORT:-8080}", protocol: tcp}
    volumes:
      - /root/logs:/app/logs
    secrets:
      - {source: lab3_app_properties_v1, target: lab3-application.properties}
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m -Xss512k -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m
      TZ: Asia/Shanghai
      LAB3_BLOCK: ${LAB3_BLOCK:-manual}
    command:
      - --spring.config.additional-location=file:/run/secrets/lab3-application.properties
      - --spring.profiles.active=${PERSISTENCE:-jpa}
      - --management.metrics.tags.persistence=${PERSISTENCE:-jpa}
      - --spring.datasource.url=jdbc:mysql://lab_mysql:3306/${LAB_DATABASE:-oomall_demo}?serverTimezone=Asia/Shanghai
      - --spring.datasource.username=demouser
      - --server.tomcat.threads.max=300
      - --server.tomcat.threads.min-spare=100
      - --spring.datasource.druid.max-active=300
      - --spring.datasource.druid.min-idle=100
      - --spring.datasource.druid.initial-size=100
      - --spring.datasource.druid.stat-view-servlet.enabled=false
      - --spring.jpa.show-sql=true
      - --logging.level.cn.edu.xmu.javaee=debug
      - --management.endpoints.web.exposure.include=health,info,prometheus
      - --management.endpoint.env.show-values=never
      - --management.endpoint.health.show-details=never
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.lab3_role == app]
      resources:
        limits: {memory: 1G}
      restart_policy: {delay: 10s}
  prometheus:
    image: lab3/prometheus:20261017
    networks: [javaee-proxy]
    ports:
      - {target: 9090, published: 9090, protocol: tcp, mode: host}
    volumes:
      - /root/prometheus:/etc/prometheus:ro
      - lab3-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.lab3_role == monitor]
      resources:
        limits: {memory: 512M}
  node-exporter:
    image: lab3/node-exporter:20261017
    networks: [javaee-proxy]
    ports:
      - {target: 9100, published: 9100, protocol: tcp, mode: host}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    deploy:
      mode: global
      resources:
        limits: {memory: 96M}
networks:
  javaee-proxy: {external: true}
volumes:
  lab3-prometheus-data:
secrets:
  lab3_app_properties_v1: {external: true}
